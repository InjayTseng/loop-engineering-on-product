<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop 儀表板</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --accent: #2a78d6; --accent-track: #d6e6f8; --accent-ink: #1d5aa3;
  --good: #0ca30c; --good-ink: #006300; --warning: #fab219; --warning-ink: #8a5a00;
  --serious: #ec835a; --critical: #d03b3b; --critical-ink: #b02a2a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-track: #1f3450; --accent-ink: #8bb9f0;
    --good-ink: #0ca30c; --warning-ink: #fab219; --critical-ink: #f07a7a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #222221;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-track: #1f3450; --accent-ink: #8bb9f0;
  --good-ink: #0ca30c; --warning-ink: #fab219; --critical-ink: #f07a7a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; }
button { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }

/* header */
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
.meta { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta b { font-weight: 500; color: var(--ink); }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.pill.running .dot { background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
.pill.parked .dot { background: var(--warning); }
.pill.stopped .dot { background: var(--critical); }
.pill.done .dot { background: var(--accent); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pill.running .dot, .node.now { animation: none !important; } }
.ghost { background: transparent; border: 0; box-shadow: inset 0 0 0 1px var(--ring); border-radius: 8px; padding: 3px 10px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.ghost:hover { background: var(--surface); color: var(--ink); }
.ghost[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 0 0 1px var(--axis); background: var(--surface); }

.banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring); }
.banner .ic { font-weight: 700; }
.banner.parked { box-shadow: inset 3px 0 0 var(--warning), inset 0 0 0 1px var(--ring); }
.banner.stopped { box-shadow: inset 3px 0 0 var(--critical), inset 0 0 0 1px var(--ring); }
.banner code { background: var(--page); padding: 1px 5px; border-radius: 4px; }

/* layout */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1020px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border-radius: 12px; box-shadow: inset 0 0 0 1px var(--ring); padding: 16px; min-width: 0; }
.card > h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; white-space: nowrap; }
.card > h2 .sub { white-space: normal; overflow-wrap: anywhere; min-width: 0; }
.card > h2 .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
.card > h2 .right { margin-left: auto; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* now */
.now-top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; margin-bottom: 16px; }
.hero { font-size: 48px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.hero small { font-size: 18px; font-weight: 500; color: var(--ink-2); margin-left: 4px; }
.hero-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-left: auto; }
.tile .v { font-size: 20px; font-weight: 600; }
.tile .l { font-size: 12px; color: var(--muted); }

.pipe { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 2px 8px; }
.node { flex: 1 0 64px; min-width: 64px; text-align: center; padding: 8px 4px; border-radius: 8px; position: relative; background: var(--page); box-shadow: inset 0 0 0 1px var(--ring); color: var(--muted); }
.node .k { font-weight: 700; font-size: 15px; }
.node .n { font-size: 11px; }
.node.done { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--axis); }
.node.done .k::after { content: " ✓"; font-size: 11px; color: var(--good-ink); }
.node.now { background: var(--accent); color: #fff; box-shadow: none; animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px var(--accent-track); } }
.link { flex: 0 0 10px; align-self: center; height: 2px; background: var(--axis); }
.side { display: flex; gap: 8px; margin-left: 14px; padding-left: 14px; border-left: 1px dashed var(--axis); }
.side .node { flex-basis: 64px; }
@media (max-width: 640px) {
  .pipe { flex-wrap: wrap; gap: 6px; overflow: visible; }
  .pipe .link { display: none; }
  .pipe > .node { flex: 1 0 calc(25% - 6px); }
  .side { flex: 1 0 100%; margin: 0; padding: 0; border: 0; }
  .side .node { flex: 1 0 calc(50% - 4px); }
}
.nowline { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; margin-top: 10px; }
.nowline .what { font-size: 15px; font-weight: 500; }
.nowline .t { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }

/* timeline */
.cells { display: flex; flex-wrap: wrap; gap: 6px; }
.cell { width: 46px; border: 0; background: var(--page); border-radius: 8px; padding: 4px 0 5px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--ring); position: relative; }
.cell:hover { box-shadow: inset 0 0 0 1px var(--axis); }
.cell[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.cell .no { font-size: 11px; color: var(--muted); display: block; font-variant-numeric: tabular-nums; }
.cell .ic { font-size: 16px; font-weight: 700; line-height: 20px; display: block; }
.cell .rj { font-size: 10px; color: var(--ink-2); display: block; min-height: 14px; }
.cell .marks { position: absolute; top: -7px; right: -4px; display: flex; gap: 2px; }
.mk { font-size: 9px; font-weight: 700; line-height: 13px; min-width: 13px; padding: 0 2px; border-radius: 4px; background: var(--raised); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--axis); }
.mk.alert { color: #fff; background: var(--critical); box-shadow: none; }
.mk.warn { color: #000; background: var(--warning); box-shadow: none; }
.s-SHIPPED .ic { color: var(--good-ink); }
.s-REJECTED .ic { color: var(--warning-ink); }
.s-NOOP .ic { color: var(--critical-ink); }
.s-RUNNING .ic { color: var(--accent-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.legend b { font-weight: 700; }

.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--raised); color: var(--ink); box-shadow: 0 4px 16px rgba(0,0,0,.15), inset 0 0 0 1px var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 320px; display: none; }
.tip b { font-weight: 600; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
tr.sel td { background: var(--page); }
tbody tr { cursor: pointer; }
.scroll-x { overflow-x: auto; }

/* round detail */
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin-bottom: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.status { display: inline-flex; gap: 5px; align-items: center; font-weight: 600; }
.status.SHIPPED { color: var(--good-ink); } .status.REJECTED { color: var(--warning-ink); }
.status.NOOP { color: var(--critical-ink); } .status.RUNNING { color: var(--accent-ink); }
.steps { list-style: none; margin: 0 0 14px; padding: 0; border-left: 2px solid var(--grid); }
.steps li { position: relative; padding: 2px 0 8px 14px; font-size: 13px; }
.steps li::before { content: ""; position: absolute; left: -5px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.steps li.cur::before { background: var(--accent); }
.steps .nd { font-weight: 700; margin-right: 6px; }
.steps .tm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 6px; }
.gates { display: grid; gap: 6px; margin-bottom: 14px; }
.gate { font-size: 13px; background: var(--page); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--axis); margin-right: 6px; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }

/* meters */
.meter { margin-bottom: 14px; }
.meter:last-child { margin-bottom: 0; }
.meter .top { display: flex; gap: 8px; font-size: 13px; }
.meter .top .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.track { height: 8px; border-radius: 4px; background: var(--accent-track); margin: 5px 0 3px; overflow: hidden; }
.fill { height: 100%; border-radius: 4px; background: var(--accent); min-width: 2px; }
.fill.w { background: var(--warning); } .fill.c { background: var(--critical); }
.meter .d { font-size: 12px; color: var(--muted); }
.meter.off .track { opacity: .45; }

/* ideas */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.ideas { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
.ideas li { border-bottom: 1px solid var(--grid); padding: 6px 0; font-size: 13px; }
.ideas details summary { cursor: pointer; list-style: none; overflow-wrap: anywhere; }
.ideas details summary::-webkit-details-marker { display: none; }
.ideas details p { margin: 4px 0 0; color: var(--ink-2); font-size: 12px; }
.tag { font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 4px; margin-right: 4px; box-shadow: inset 0 0 0 1px var(--axis); color: var(--ink-2); }

.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
dialog { border: 0; border-radius: 12px; padding: 0; width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 64px); background: var(--surface); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog header { padding: 12px 16px; margin: 0; border-bottom: 1px solid var(--grid); }
dialog pre { margin: 0; padding: 16px; overflow: auto; max-height: calc(100vh - 140px); white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Loop 儀表板</h1>
    <span id="pill" class="pill"><span class="dot"></span><span id="pillText">載入中…</span></span>
    <div class="meta" id="meta"></div>
    <span class="spacer"></span>
    <span class="muted small" id="updated" aria-live="polite"></span>
    <button class="ghost" id="theme" title="切換深淺色">主題：自動</button>
  </header>
  <div id="banner"></div>

  <div class="grid">
    <div class="col">
      <section class="card" aria-labelledby="h-now">
        <h2 id="h-now">現在 <span class="sub" id="nowSub"></span></h2>
        <div class="now-top">
          <div><div class="hero-label">目前輪次</div><div class="hero" id="hero">–</div></div>
          <div class="tiles" id="tiles"></div>
        </div>
        <div class="pipe" id="pipe" role="list" aria-label="這一輪的節點"></div>
        <div class="nowline" id="nowline"></div>
      </section>

      <section class="card" aria-labelledby="h-hist">
        <h2 id="h-hist">歷程 <span class="sub" id="histSub"></span>
          <button class="ghost right" id="viewToggle" aria-pressed="false">表格檢視</button></h2>
        <div id="cells" class="cells" role="list"></div>
        <div id="roundTable" class="scroll-x" hidden></div>
        <div class="legend">
          <span><b style="color:var(--good-ink)">✓</b> 出貨</span>
          <span><b style="color:var(--warning-ink)">✕</b> 整輪被拒</span>
          <span><b style="color:var(--critical-ink)">!</b> NOOP（建置／驗證放棄）</span>
          <span><b style="color:var(--accent-ink)">◌</b> 進行中</span>
          <span>↩N 輪內被拒的點子數</span>
          <span><span class="mk">T</span> 軌跡檢查 <span class="mk">A</span> 深度現況 <span class="mk">J</span> Jev 同招 <span class="mk">P</span> 定位；紅／黃 = STOP／REDIRECT、BROKEN</span>
        </div>
      </section>

      <section class="card" aria-labelledby="h-round" id="roundCard">
        <h2 id="h-round">第 – 輪</h2>
        <div id="roundBody" class="empty">點歷程裡的任一輪看細節。</div>
      </section>
    </div>

    <div class="col">
      <section class="card" aria-labelledby="h-stop">
        <h2 id="h-stop">停機條件 <span class="sub">離門檻多遠（與 driver 同一套算法）</span></h2>
        <div id="meters"></div>
      </section>
      <section class="card" aria-labelledby="h-ideas">
        <h2 id="h-ideas">點子 <span class="sub" id="ledgerPath"></span></h2>
        <div class="tabs" id="ideaTabs" role="tablist"></div>
        <ul class="ideas" id="ideas"></ul>
      </section>
      <section class="card" aria-labelledby="h-jev" id="jevCard" hidden>
        <h2 id="h-jev">Jev <span class="sub" id="jevSub"></span></h2>
        <div class="scroll-x" id="jev"></div>
      </section>
      <section class="card" aria-labelledby="h-docs" id="docsCard" hidden>
        <h2 id="h-docs">文件</h2>
        <div class="files" id="docs"></div>
      </section>
    </div>
  </div>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<dialog id="viewer"><header style="display:flex;gap:8px;align-items:center"><b id="viewerTitle"></b><span class="spacer"></span><button class="ghost" onclick="viewer.close()">關閉</button></header><pre id="viewerBody"></pre></dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NODES = [["C", "現況"], ["R", "研究"], ["F", "價值閘"], ["S", "PRD"], ["D", "開發"], ["B", "建置"], ["V", "驗證"], ["Y", "出貨"]];
const SIDE = [["T", "軌跡"], ["P", "定位"]];
const ICON = { SHIPPED: "✓", REJECTED: "✕", NOOP: "!", RUNNING: "◌" };
const WORD = { SHIPPED: "出貨", REJECTED: "整輪被拒", NOOP: "NOOP", RUNNING: "進行中" };
const STATUS = { running: "執行中", parked: "停下等人（定位）", done: "已完成", stopped: "已停止", idle: "尚未啟動" };
let S = null, selected = null, userPicked = false, ideaTab = "active", tabPicked = false, tableView = false;

const dur = (ms) => {
  if (!(ms >= 0)) return "–";
  const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h} 時 ${m} 分` : m ? `${m} 分 ${String(r).padStart(2, "0")} 秒` : `${r} 秒`;
};
const time = (ts) => ts ? new Date(ts).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) : "";
const verdictOf = (r) => r.verdict || (S.current && S.current.round === r.n ? "RUNNING" : "");
const roundEnd = (r, i) => r.end || S.rounds[i + 1]?.start || (verdictOf(r) === "RUNNING" ? S.generatedAt : i === S.rounds.length - 1 ? S.run.endedAt : null);
const roundDur = (r, i) => { const e = roundEnd(r, i); return r.start && e ? new Date(e) - new Date(r.start) : NaN; };

// --- theme (auto → light → dark), per-viewer convenience only -------------------------------
const themes = ["auto", "light", "dark"];
let theme = "auto";
try { theme = localStorage.getItem("loop-dash-theme") || "auto"; } catch {}
const applyTheme = () => {
  if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  $("theme").textContent = `主題：${{ auto: "自動", light: "淺色", dark: "深色" }[theme]}`;
};
$("theme").onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; try { localStorage.setItem("loop-dash-theme", theme); } catch {} applyTheme(); };
applyTheme();

$("viewToggle").onclick = () => { tableView = !tableView; $("viewToggle").setAttribute("aria-pressed", tableView); renderHistory(); };

async function openFile(path) {
  $("viewerTitle").textContent = path; $("viewerBody").textContent = "載入中…"; $("viewer").showModal();
  try { const r = await fetch(`/api/file?path=${encodeURIComponent(path)}`); $("viewerBody").textContent = await r.text(); }
  catch (e) { $("viewerBody").textContent = String(e); }
}
document.addEventListener("click", (e) => { const a = e.target.closest("[data-file]"); if (a) { e.preventDefault(); openFile(a.dataset.file); } });

// --- render ------------------------------------------------------------------------------------
function renderHeader() {
  const run = S.run;
  $("pill").className = `pill ${run.status}`;
  $("pillText").textContent = STATUS[run.status] || run.status;
  $("meta").innerHTML = [
    run.product && `<span>${esc(run.product)}</span>`,
    run.branch && `<span>分支 <b>${esc(run.branch)}</b></span>`,
    run.model && `<span>模型 <b>${esc(run.model)}</b></span>`,
    run.jev && `<span>Jev <b>${esc(run.jev)}</b></span>`,
    `<span>資料 <b>${esc(S.source)}</b>${S.replay ? "（重播）" : ""}</span>`,
  ].filter(Boolean).join("");
  $("updated").textContent = S.replay ? "" : `更新於 ${time(S.generatedAt)}`;
  let b = "";
  if (run.status === "parked") b = `<div class="banner parked"><span class="ic">⏸</span><div><b>停下來等人：</b>${esc(run.parkedReason || run.stopReason)}<br><span class="small muted">下一步：跑 <code>/position</code> 重新對準定位，再重跑 <code>scripts/run-loop.sh</code>。</span></div></div>`;
  else if (run.status === "stopped" && run.stopReason) b = `<div class="banner stopped"><span class="ic">■</span><div><b>已停止：</b>${esc(run.stopReason)}</div></div>`;
  else if (run.status === "stopped") b = `<div class="banner stopped"><span class="ic">■</span><div><b>driver 沒有在跑</b>，而且最後沒有正常結束（被 kill 或中斷）。上一次的紀錄如下。</div></div>`;
  $("banner").innerHTML = b;
}

function renderNow() {
  const cur = S.current, rs = S.rounds, lastR = rs[rs.length - 1];
  const shownN = cur?.round || lastR?.n || 0;
  $("hero").innerHTML = `${shownN || "–"}<small>/ ${S.run.n}</small>`;
  const shipped = rs.filter((r) => r.verdict === "SHIPPED").length;
  const rejects = rs.reduce((a, r) => a + (r.rejects || 0), 0);
  const finished = rs.map((r, i) => roundDur(r, i)).filter((d, i) => rs[i].verdict && d > 0);
  const avg = finished.length ? finished.reduce((a, b) => a + b, 0) / finished.length : NaN;
  $("tiles").innerHTML = [
    ["已出貨", `${shipped}`],
    ["被拒的點子", `${rejects}`],
    ["NOOP", `${rs.filter((r) => r.verdict === "NOOP").length}`],
    ["平均每輪", dur(avg)],
  ].map(([l, v]) => `<div class="tile"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join("");

  // which nodes this round already passed, from its step events
  const r = rs.find((x) => x.n === shownN);
  const seen = new Set((r?.steps || []).map((s) => (s.node === "M" ? "R" : s.node)));
  const nowNode = cur ? (cur.node === "M" ? "R" : cur.node) : null;
  const box = ([k, n]) => {
    const label = k === "R" && cur?.node === "M" ? "維護" : n;
    const side = k === "T" || k === "P";
    const ran = side ? (r?.gates || []).some((g) => g.type === (k === "T" ? "traj" : "position")) : seen.has(k) || (r?.verdict === "SHIPPED" && !cur);
    const cls = k === nowNode ? "now" : ran ? "done" : "";
    return `<div class="node ${cls}" role="listitem" aria-current="${k === nowNode}"><div class="k">${k}</div><div class="n">${label}</div>${k === nowNode ? '<span class="sr">（目前）</span>' : ""}</div>`;
  };
  $("pipe").innerHTML = NODES.map(box).join('<div class="link" aria-hidden="true"></div>') + `<div class="side">${SIDE.map(box).join("")}</div>`;

  if (cur) {
    const since = Date.now() - new Date(cur.since);
    $("nowSub").textContent = cur.kind === "gate" ? "driver 正在跑檢查" : `第 ${cur.round} 輪進行中`;
    $("nowline").innerHTML = `<span class="what">${esc(cur.label)}</span>
      <span class="t">這一步已 ${dur(since)}</span>
      ${cur.roundSince ? `<span class="t">這一輪已 ${dur(Date.now() - new Date(cur.roundSince))}</span>` : ""}
      ${cur.kind === "round" && !cur.node ? '<span class="small muted">（round agent 還沒回報步驟；舊版 spec 不會回報，見 docs/10-dashboard.md）</span>' : ""}`;
  } else {
    $("nowSub").textContent = S.run.status === "running" ? "輪與輪之間" : "目前沒有在跑";
    $("nowline").innerHTML = lastR ? `<span class="what">上一輪（第 ${lastR.n} 輪）：<span class="status ${esc(lastR.verdict)}">${ICON[lastR.verdict] || ""} ${esc(WORD[lastR.verdict] || lastR.verdict || "")}</span></span>
      <span class="t">${esc(lastR.subject || lastR.category || "")}</span>` : '<span class="muted">還沒有任何一輪。啟動：<code>scripts/run-loop.sh</code></span>';
  }
}

function marksFor(r) {
  return r.gates.map((g) => {
    const k = { traj: "T", audit: "A", jev_same: "J", position: "P" }[g.type];
    const cls = ["STOP", "BROKEN", "DISAGREE", "DISAGREED"].includes(g.verdict) ? "alert" : ["REDIRECT", "GAPS", "SAME"].includes(g.verdict) ? "warn" : "";
    return `<span class="mk ${cls}" title="${esc(g.line)}">${k}</span>`;
  }).join("");
}

function renderHistory() {
  const rs = S.rounds;
  const shipped = rs.filter((r) => r.verdict === "SHIPPED").length;
  $("histSub").textContent = rs.length ? `${rs.length} 輪 · 出貨 ${shipped}` : "";
  $("cells").hidden = tableView; $("roundTable").hidden = !tableView;
  if (!rs.length) { $("cells").innerHTML = '<div class="empty">還沒有歷程。</div>'; return; }
  if (!tableView) {
    $("cells").innerHTML = rs.map((r) => {
      const v = verdictOf(r) || "NOOP";
      return `<button class="cell s-${v}" role="listitem" data-round="${r.n}" aria-current="${selected === r.n}"
        aria-label="第 ${r.n} 輪：${WORD[v] || v}，拒絕 ${r.rejects || 0} 個點子">
        <span class="marks">${marksFor(r)}</span>
        <span class="no">${r.n}</span><span class="ic">${ICON[v] || "?"}</span><span class="rj">${r.rejects ? `↩${r.rejects}` : ""}</span></button>`;
    }).join("");
  } else {
    $("roundTable").innerHTML = `<table><thead><tr><th>輪</th><th>結果</th><th>類別</th><th>漏斗</th><th class="num">拒絕</th><th class="num">用時</th><th>commit</th></tr></thead><tbody>${
      rs.map((r, i) => { const v = verdictOf(r) || "NOOP";
        return `<tr data-round="${r.n}" class="${selected === r.n ? "sel" : ""}"><td>${r.n}</td><td><span class="status ${v}">${ICON[v] || ""} ${WORD[v] || v}</span></td>
        <td>${esc(r.category || "")}</td><td>${esc(r.step || "")}</td><td class="num">${r.rejects || 0}</td><td class="num">${dur(roundDur(r, i))}</td>
        <td>${esc(r.subject || "")}</td></tr>`; }).join("")}</tbody></table>`;
  }
}

function renderRound() {
  const i = S.rounds.findIndex((r) => r.n === selected), r = S.rounds[i];
  if (!r) { $("h-round").textContent = "這一輪"; $("roundBody").className = "empty"; $("roundBody").innerHTML = '<div class="empty">點歷程裡的任一輪看細節。</div>'; return; }
  const v = verdictOf(r) || "NOOP";
  $("h-round").innerHTML = `第 ${r.n} 輪 <span class="status ${v}" style="font-size:13px">${ICON[v] || ""} ${WORD[v] || v}</span>`;
  const flags = [r.reset ? "RESET 輪（上一輪被拒或 REDIRECT）" : "", r.maint ? "維護輪（state BROKEN）" : ""].filter(Boolean).join("、");
  const kv = [
    ["類別", r.category], ["漏斗", r.step], ["輪內被拒", `${r.rejects || 0} 個點子`],
    ["出貨內容", r.subject ? `${r.commit ? `<code>${esc(r.commit)}</code> ` : ""}${esc(r.subject)}` : ""],
    ["開始", r.start ? `${new Date(r.start).toLocaleString("zh-TW", { hour12: false })}` : ""], ["用時", dur(roundDur(r, i))],
    ["旗標", flags],
  ].filter(([, x]) => x);
  const steps = r.steps.length ? `<ol class="steps">${r.steps.map((s, j) => {
      const next = r.steps[j + 1]?.ts || roundEnd(r, i);
      const isCur = S.current?.round === r.n && j === r.steps.length - 1;
      return `<li class="${isCur ? "cur" : ""}"><span class="nd">${esc(s.node)}</span>${esc(s.note)}<span class="tm">${time(s.ts)} · ${dur(new Date(next) - new Date(s.ts))}</span></li>`;
    }).join("")}</ol>` : `<p class="small muted">這一輪沒有步驟紀錄${S.replay ? "（舊 run 的 log 沒有 step 事件）" : ""}。</p>`;
  const gates = r.gates.length ? `<div class="gates">${r.gates.map((g) => `<div class="gate"><span class="chip">${esc({ traj: "軌跡", audit: "現況", jev_same: "Jev", position: "定位" }[g.type])}</span>${esc(g.line || g.verdict)}</div>`).join("")}</div>` : "";
  // A round's log is written when its `claude -p` exits, so it only exists for finished rounds.
  const files = [...(r.files || []), ...(S.replay || !r.verdict ? [] : [`.loop/round-${String(r.n).padStart(3, "0")}.log`])];
  $("roundBody").className = "";
  $("roundBody").innerHTML = `<dl class="kv">${kv.map(([k, x]) => `<dt>${k}</dt><dd>${k === "出貨內容" ? x : esc(x)}</dd>`).join("")}</dl>
    <div class="small muted" style="margin-bottom:6px">步驟</div>${steps}${gates}
    ${files.length ? `<div class="files">${files.map((f) => `<a href="#" class="ghost" data-file="${esc(f)}">${esc(f.split("/").pop())}</a>`).join("")}</div>` : ""}`;
}

function renderMeters() {
  $("meters").innerHTML = S.meters.map((m) => {
    const pct = m.limit ? Math.min(100, (m.value / m.limit) * 100) : 0;
    const sev = !m.armed ? "" : m.fired || pct >= 100 ? "c" : pct >= 50 ? "w" : "";
    const val = m.key === "plateau" ? (m.armed ? `${m.value} / ${m.limit}` : "視窗未滿") : `${m.value} / ${m.limit}`;
    return `<div class="meter ${m.armed ? "" : "off"}"><div class="top"><span>${m.fired ? "⚠ " : ""}${esc(m.label)}</span><span class="val">${esc(val)}</span></div>
      <div class="track" role="meter" aria-valuemin="0" aria-valuemax="${m.limit}" aria-valuenow="${m.value}" aria-label="${esc(m.label)}">${m.armed ? `<div class="fill ${sev}" style="width:${pct}%"></div>` : ""}</div>
      <div class="d">${esc(m.detail)}</div></div>`;
  }).join("");
}

const TERMINAL = ["COMPLETED", "REJECTED", "FAILED", "LOW_IMPACT"];
const GROUPS = [
  ["active", "進行中／排隊", (i) => !TERMINAL.includes(i.status)],
  ["done", "已完成", (i) => i.status === "COMPLETED"],
  ["rejected", "已拒絕", (i) => i.status === "REJECTED"],
  ["other", "失敗／低價值", (i) => i.status === "FAILED" || i.status === "LOW_IMPACT"],
];
function renderIdeas() {
  if (!tabPicked) ideaTab = (GROUPS.find((g) => S.ideas.some(g[2])) || GROUPS[0])[0];
  $("ledgerPath").textContent = S.ideas.length ? `${S.ideas.length} 條 · ${S.ledgerPath}` : S.ledgerPath;
  $("ideaTabs").innerHTML = GROUPS.map(([k, label, f]) =>
    `<button class="ghost" role="tab" aria-pressed="${ideaTab === k}" aria-selected="${ideaTab === k}" data-tab="${k}">${label} ${S.ideas.filter(f).length}</button>`).join("");
  const f = GROUPS.find((g) => g[0] === ideaTab)[2];
  const list = S.ideas.filter(f).reverse();
  $("ideas").innerHTML = list.length ? list.map((i) => `<li><details><summary>
      ${ideaTab === "active" ? `<span class="tag">${esc(i.status)}</span>` : ""}${i.jev ? '<span class="tag">Jev 快速拒絕</span>' : ""}${esc(i.title)}</summary>
      ${i.detail ? `<p>${esc(i.detail)}</p>` : ""}</details></li>`).join("") : '<li class="empty">沒有。</li>';
}
$("ideaTabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) { ideaTab = b.dataset.tab; tabPicked = true; renderIdeas(); } });

function renderJev() {
  const show = S.jev.length || (S.run.jev && S.run.jev !== "off");
  $("jevCard").hidden = !show; if (!show) return;
  $("jevSub").textContent = `模式 ${S.run.jev} · 最近 ${S.jev.length} 次`;
  $("jev").innerHTML = S.jev.length ? `<table><thead><tr><th>時間</th><th>任務</th><th>結果</th></tr></thead><tbody>${S.jev.map((j) =>
    `<tr><td class="small">${time(j.ts)}</td><td>${esc(j.task)}</td><td><span class="chip">${esc(j.mode === "shadow" ? `SHADOW→${j.verdict}` : j.verdict)}</span><span class="small muted">${esc(j.why || "")}</span></td></tr>`).join("")}</tbody></table>`
    : '<div class="empty">這次 run 還沒有呼叫過 Jev。</div>';
}

function renderDocs() {
  const all = [...S.docs, ...S.prps];
  $("docsCard").hidden = !all.length || S.replay;
  $("docs").innerHTML = all.map((f) => `<a href="#" class="ghost" data-file="${esc(f)}">${esc(f)}</a>`).join("");
}

// --- selection + tooltip ------------------------------------------------------------------------
function pick(n) { selected = n; userPicked = true; renderHistory(); renderRound(); }
$("cells").addEventListener("click", (e) => { const c = e.target.closest("[data-round]"); if (c) pick(+c.dataset.round); });
$("roundTable").addEventListener("click", (e) => { const c = e.target.closest("[data-round]"); if (c) pick(+c.dataset.round); });
const tip = $("tip");
$("cells").addEventListener("mousemove", (e) => {
  const c = e.target.closest("[data-round]"); if (!c) { tip.style.display = "none"; return; }
  const i = S.rounds.findIndex((r) => r.n === +c.dataset.round), r = S.rounds[i], v = verdictOf(r) || "NOOP";
  tip.innerHTML = `<b>第 ${r.n} 輪 · ${WORD[v] || v}</b><br>${esc(r.category || "")}${r.step ? ` · ${esc(r.step)}` : ""}<br>
    ${r.subject ? esc(r.subject) + "<br>" : ""}被拒 ${r.rejects || 0} · 用時 ${dur(roundDur(r, i))}${r.gates.length ? "<br>" + r.gates.map((g) => esc(g.line || g.verdict)).join("<br>") : ""}`;
  tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = `${x}px`; tip.style.top = `${y}px`;
});
$("cells").addEventListener("mouseleave", () => { tip.style.display = "none"; });

// --- poll -----------------------------------------------------------------------------------------
async function tick() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    S = await r.json();
    if (!userPicked || !S.rounds.some((x) => x.n === selected)) selected = S.current?.round || S.rounds[S.rounds.length - 1]?.n || null;
    renderHeader(); renderNow(); renderHistory(); renderRound(); renderMeters(); renderIdeas(); renderJev(); renderDocs();
  } catch (e) {
    $("pill").className = "pill stopped"; $("pillText").textContent = "連不到 dashboard server";
  }
  if (!S?.replay) setTimeout(tick, 3000);
}
tick();
</script>
