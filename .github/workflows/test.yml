name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck -S error scripts/*.sh scripts/adapters/*.sh
      - name: driver (stubbed claude)
        run: bash scripts/test-driver.sh
      - name: dashboard
        run: node --test scripts/dashboard/test/*.test.mjs
      - name: jev
        working-directory: scripts/jev
        run: npm ci && npm test
